# CI do grupo (requisito da secao 7 do enunciado do Lab03): os testes do
# pipeline rodam a cada push e a cada pull request, com o limite de cobertura
# do proprio projeto (80% das linhas, configurado em package.json).
#
# De quebra, este workflow passa a gerar no repositorio do grupo os mesmos
# dados de CI que o laboratorio minera (workflow runs do default branch
# disparados por push).
#
# O pipeline NAO e' executado aqui: a coleta precisa de GITHUB_TOKEN com cota
# propria e leva horas. A CI cobre so' os testes, que nao tocam a rede.
name: testes

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lab03:
    name: Lab03 - pipeline DORA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab3/Sprint01

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # A versao exigida pelo projeto (engines.node) e fixada em .nvmrc do
          # Lab02; aqui ela vem do proprio package.json do Lab03.
          node-version: "22.x"

      # O projeto nao tem dependencias (so' a biblioteca padrao do Node), entao
      # nao ha "npm install" nem lockfile para cachear.
      - name: Versao do Node
        run: node --version

      - name: Testes com cobertura (minimo de 80% das linhas)
        run: npm run test:cobertura

  lab04:
    name: Lab04 - simulacao e testes de hipotese
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sem "pip install": o Lab04 usa so' a biblioteca padrao. A conferencia
      # contra o SciPy (tests/test_conferencia_scipy.py) se pula sozinha
      # quando ele nao esta presente.
      - name: Versao do Python
        run: python --version

      - name: Testes
        run: python -m unittest discover -s tests -v

      # O dashboard e' a entrega final: um erro ao monta'-lo nao aparece em
      # nenhum teste unitario, so' na hora de abrir a pagina.
      - name: Dashboard monta sem erro
        run: python src/dashboard.py --saida /tmp/dashboard.html

  lab05:
    name: Lab05 - instrumentacao e analise
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A ANALISE do Lab05 roda so' com a biblioteca padrao; a COLETA precisa
      # do dnspython. Os testes da coleta se pulam sozinhos quando ele falta,
      # entao a primeira etapa prova que a analise e' mesmo autossuficiente e
      # a segunda exercita a suite inteira.
      - name: Testes sem dependencia nenhuma (so' a analise)
        run: python -m unittest discover -s Sprint01/testes -v

      - name: Ambiente de coleta
        run: pip install -r Sprint01/coleta/requirements.txt

      - name: Testes com o ambiente de coleta (suite inteira)
        run: python -m unittest discover -s Sprint01/testes -v

      # O verificador de ambiente e' o que impede uma coleta com a pilha
      # errada; se ele quebrar, ninguem descobre ate' a coleta de 7 dias.
      - name: Verificador de ambiente roda
        run: python Sprint01/coleta/ambiente.py

      # A analise precisa continuar lendo o CSV do piloto versionado.
      - name: Analise roda sobre os dados do piloto
        run: python Sprint01/coleta/analise.py Sprint01/dados/piloto_c.csv --replicas 200 > /dev/null

      # Base de dados (issue #133): o bruto versionado nao pode ter mudado
      # depois de consolidado, e a base versionada tem de ser exatamente a que
      # o bruto gera.
      - name: Testes da consolidacao da base
        run: python -m unittest discover -s Sprint02/testes -v

      - name: Base confere com os dados brutos
        run: python Sprint02/consolidar_base.py --verificar

      - name: Analise roda sobre a base consolidada
        run: python Sprint01/coleta/analise.py Sprint02/base/consultas.csv.gz --lote piloto --replicas 200 > /dev/null

      # Validacao (issue #134): a base validada versionada tem de ser
      # exatamente a que a base consolidada gera, e a analise tem de le-la.
      - name: Base validada confere com a base consolidada
        run: python Sprint02/validar_base.py --verificar

      - name: Analise roda sobre a base validada
        run: python Sprint01/coleta/analise.py Sprint02/base_validada/consultas.csv.gz --lote piloto --replicas 200 > /dev/null

      # Decisao D13: o lote provisoria e' o dado do experimento. O resultado
      # versionado tem de sair identico da base validada (bootstrap semeado).
      - name: Resultado do experimento e' reprodutivel
        run: |
          python Sprint01/coleta/analise.py Sprint02/base_validada/consultas.csv.gz --lote provisoria --md /tmp/analise_rede-c.md > /dev/null
          diff Sprint02/resultados/analise_rede-c.md /tmp/analise_rede-c.md
